[package]
name = "flowsta-vault-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
description = "Find and talk to Flowsta Vault on the person's own device, and keep a desktop app's identity link, device key and profiles"
repository = "https://github.com/WeAreFlowsta/flowsta-rust-sdk"
keywords = ["flowsta", "vault", "identity", "desktop"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = "2.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
